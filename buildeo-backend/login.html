<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login to Buildeo App</title>
</head>
<body>
    <h2>Hello {{.Name}},</h2>
    <p>Welcome to Buildeo! To log in, use the following token:</p>
    <p><strong>{{.Token}}</strong></p>
    <p>Use this token to log in to your account. If you didn't request this, please ignore this email.</p>
    <p>Thanks,<br>The Buildeo Team</p>
</body>
</html>
